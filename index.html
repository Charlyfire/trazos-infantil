<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fffaf0">
    <title>TRAZOS · Grafomotricidad</title>
    <link rel="stylesheet" href="styles.css">
    <script src="tracing.js" defer></script>
    <script src="templates.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main id="app">
      <section id="home" class="screen home" aria-labelledby="title">
        <h1 id="title">TRAZOS</h1>
        <button id="start" class="button start-button" type="button">EMPEZAR</button>
      </section>

      <section id="exercise" class="screen exercise" aria-label="Ejercicio de trazado" hidden>
        <div id="teacher-panel" class="teacher-panel">
          <nav class="teacher-controls" aria-label="Controles del profesor">
            <button id="home-button" class="icon-button" type="button" aria-label="Volver al inicio" title="Volver al inicio">
              <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 14 16 5l11 9v13H19v-9h-6v9H5Z" /></svg>
            </button>
            <div class="mode-controls" role="group" aria-label="Modo de trabajo">
              <button id="demo" type="button" aria-pressed="true"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m7 22-1 5 5-1L27 10l-4-4Z M19 10l4 4" /></svg><span>DEMOSTRACIÓN</span></button>
              <button id="practice" type="button" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 26v-9m7 9V6m8 20V12m7 14V6 M3 17h4M10 6h4M18 12h4M25 6h4" /></svg><span>PRÁCTICA</span></button>
            </div>
            <button id="clear" class="icon-button" type="button" aria-label="Repetir todas las líneas" title="Repetir">
              <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 11a11 11 0 1 1-1 9 M7 4v8h8" /></svg>
            </button>
            <button id="advance" class="icon-button" type="button" aria-label="Siguiente ejercicio" title="Siguiente">
              <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 16h22 M18 7l9 9-9 9" /></svg>
            </button>
          </nav>
          <div class="template-controls">
            <div class="template-picker">
              <label class="sr-only" for="template">Plantilla para practicar</label>
              <svg class="template-icon" viewBox="0 0 32 32" aria-hidden="true"><path id="template-symbol" d="M16 4v24m-8-8 8 8 8-8" /></svg>
              <select id="template" aria-label="Plantilla para practicar"></select>
              <svg class="select-chevron" viewBox="0 0 32 32" aria-hidden="true"><path d="m8 12 8 8 8-8" /></svg>
            </div>
            <button id="play-demo" class="small-icon-button" type="button" aria-label="Ver demostración lenta" title="Ver demostración lenta" aria-pressed="false">
              <svg viewBox="0 0 32 32" aria-hidden="true"><path id="demo-symbol" d="m10 5 18 11-18 11Z" /></svg>
            </button>
            <button id="settings-button" class="small-icon-button" type="button" aria-label="Ajustes del profesor" title="Ajustes del profesor" aria-controls="settings-panel" aria-expanded="false">
              <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 8h22M5 16h22M5 24h22" /><circle cx="11" cy="8" r="3" /><circle cx="22" cy="16" r="3" /><circle cx="14" cy="24" r="3" /></svg>
            </button>
          </div>
        </div>
        <section id="settings-panel" class="settings-panel" aria-labelledby="settings-title" hidden>
          <h2 id="settings-title">AJUSTES DEL PROFESOR</h2>
          <p>Altura de los dibujos</p>
          <div class="height-controls">
            <button id="height-down" type="button">BAJAR</button>
            <output id="height-label">Altura habitual</output>
            <button id="height-up" type="button">SUBIR</button>
          </div>
          <p>Dificultad</p>
          <div class="help-controls" role="group" aria-label="Dificultad del ejercicio">
            <button id="help" type="button" aria-pressed="true">FÁCIL</button>
            <button id="strict" type="button" aria-pressed="false">DIFÍCIL</button>
          </div>
          <div class="background-controls">
            <button id="background-button" type="button">CARGAR FONDO</button>
            <span id="background-status" class="background-status" role="status"></span>
            <input id="background-file" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Elegir imagen de fondo" hidden>
          </div>
          <button id="settings-close" class="settings-close" type="button">LISTO</button>
        </section>
        <svg id="board" role="img" aria-label="Sigue el camino desde el círculo hasta la estrella"></svg>
        <div id="individual-controls" class="individual-controls" aria-label="Repetir cada figura"></div>
        <p id="announcement" class="sr-only" role="status"></p>
        <div id="completed" class="completed" hidden>
          <button id="repeat" class="button repeat-button" type="button">REPETIR</button>
          <button id="next" class="button next-button" type="button">SIGUIENTE</button>
        </div>
      </section>
    </main>
  </body>
</html>

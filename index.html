<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fffaf0">
    <title>TRAZOS · Grafomotricidad</title>
    <link rel="stylesheet" href="styles.css">
    <script src="tracing.js" defer></script>
    <script src="templates.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main id="app">
      <section id="home" class="screen home" aria-labelledby="title">
        <h1 id="title">TRAZOS</h1>
        <button id="start" class="button start-button" type="button">EMPEZAR</button>
      </section>

      <section id="exercise" class="screen exercise" aria-label="Ejercicio de trazado" hidden>
        <nav class="teacher-controls" aria-label="Controles del profesor">
          <button id="home-button" class="icon-button" type="button" aria-label="Volver al inicio" title="Volver al inicio">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 14 16 5l11 9v13H19v-9h-6v9H5Z" /></svg>
          </button>
          <div class="mode-controls" role="group" aria-label="Modo de trabajo">
            <button id="demo" type="button" aria-pressed="true">DEMOSTRACIÓN</button>
            <button id="practice" type="button" aria-pressed="false">PRÁCTICA</button>
          </div>
          <button id="clear" class="icon-button" type="button" aria-label="Repetir todas las líneas" title="Repetir">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 11a11 11 0 1 1-1 9 M7 4v8h8" /></svg>
          </button>
          <button id="advance" class="icon-button" type="button" aria-label="Siguiente ejercicio" title="Siguiente">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 16h22 M18 7l9 9-9 9" /></svg>
          </button>
        </nav>
        <div class="template-controls">
          <label class="sr-only" for="template">Plantilla para practicar</label>
          <select id="template" aria-label="Plantilla para practicar"></select>
        </div>
        <svg id="board" role="img" aria-label="Sigue el camino desde el círculo hasta la estrella"></svg>
        <div id="completed" class="completed" hidden>
          <p id="announcement" class="sr-only" role="status"></p>
          <button id="repeat" class="button repeat-button" type="button">REPETIR</button>
          <button id="next" class="button next-button" type="button">SIGUIENTE</button>
        </div>
      </section>
    </main>
  </body>
</html>
